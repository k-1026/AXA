<head>

<title>메디대구 수익 시뮬레이션</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#5f6878;--line:#e3e6eb;--accent:#2f6fde;--pos:#1f8a5b;--neg:#c8463d;--soft:#eef3fd;
  --s0:#d0703a;--s1:#2f6fde;--s2:#1f9a62;--s0bg:#fdf3ec;--s1bg:#eef3fd;--s2bg:#ecf8f1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--ink:#e8ebf0;--sub:#9aa3b2;--line:#2c323c;--accent:#6c9cf0;--pos:#4cc38a;--neg:#ef7a70;--soft:#232b3a;
  --s0:#ef9a62;--s1:#6c9cf0;--s2:#4cc38a;--s0bg:#2c231d;--s1bg:#1f2735;--s2bg:#1c2a23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0}
h2{font-size:19px;margin:34px 0 4px}
h3{font-size:15px;margin:0 0 10px}
.lead{color:var(--sub);font-size:14px;margin:2px 0 14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl b{font-size:14px;margin-right:4px}
.ctrl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:14px}
.ctrl button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ctrl .hint{color:var(--sub);font-size:12.5px;flex-basis:100%}
.banner{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:16px 18px;font-size:16.5px;margin-top:16px}
.sc{border-top:5px solid}
.sc .name{font-weight:700;font-size:17px}
.sc .desc{color:var(--sub);font-size:12.5px;margin:2px 0 12px;min-height:38px}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.metric:last-child{border:0}
.metric span{color:var(--sub);font-size:13.5px}
.metric strong{font-size:18px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
canvas{max-height:280px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--sub);font-weight:600;font-size:12.5px}
.scroll{overflow-x:auto}
td.how{color:var(--sub);font-size:12.5px;text-align:left;max-width:320px}
tr.combo td{background:var(--soft);font-weight:600}
tr.ref td{color:var(--sub)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;font-weight:600}
ul.c{margin:0;padding-left:18px}ul.c li{margin:6px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px}
details summary{cursor:pointer;padding:14px 18px;font-weight:600}
details .in{padding:0 18px 18px}
.glossary{font-size:12.5px;color:var(--sub);display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.glossary b{color:var(--ink)}
.note{color:var(--sub);font-size:12.5px;margin-top:8px}
.empty{color:var(--sub);padding:40px;text-align:center}
</style>
</head>

<script>

const run = (sc,li) => R.runs.find(r=>r.scenario===sc && r.L_index===li);

    <thead><tr><th>방법</th><th style="text-align:left">무엇을 · 어떻게</th><th>3년 손익 개선</th><th>첫 흑자 연도</th><th>3년차 손익</th><th>3년 손익 합계</th><th>필요 초기자금</th></tr></thead>
    <tbody>
      <tr class="ref"><td>지금 (기준)</td><td class="how">아무것도 바꾸지 않음</td><td>-</td><td>${bs.first_profit_year||'없음'}</td><td class="${cls(bs.y3_op)}">${manS(bs.y3_op)}</td><td class="${cls(bs.op_total)}">${manS(bs.op_total)}</td><td>${man(bs.need_capital)}</td></tr>
      ${leverRows(R.combos,'combo')}${leverRows(R.levers,'')}${leverRows(R.ref_levers,'ref')}
    </tbody></table></div>
    <div class="note">엑셀에서 같은 결과를 보려면 가정 시트에서 해당 칸을 바꾸면 됩니다 (엑셀 '개선방안' 시트에 바꿀 칸 표시). 요금(참고) 두 줄은 팀 확정 요금안을 바꿔야 해서 참고로만 둡니다.</div></div>

  <h2>③ 자세히 보기</h2>
  <details><summary>연간 손익표 (시나리오별)</summary><div class="in">
    <div class="ctrl" style="margin-bottom:10px">${R.scenarios.map(s=>`<button data-tsc="${s}" class="${s==='기준'?'on':''}">${s}</button>`).join('')}</div>
    <div class="scroll" id="tbl"></div></div></details>
  <details><summary>무엇이 결과를 가장 크게 흔드나 (민감도 · 3년차)</summary><div class="in"><canvas id="c4"></canvas><div class="note">${R.sensitivity_note}</div></div></details>
  <details><summary>거래 1건·병원 1곳·환자 1명 기준 (단위경제)</summary><div class="in"><table><tbody>${R.unit.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td></tr>`).join('')}</tbody></table></div></details>
  <details><summary>손익분기에 필요한 거래 수</summary><div class="in"><table><thead><tr><th>팀 인건비</th><th>필요 월 진료 완료</th><th>3년차 말 예상</th><th>배수</th><th>필요 평균 병원 수</th></tr></thead><tbody>
    ${R.breakeven.map(b=>`<tr><td>${b.label}</td><td>${b.need.toFixed(1)}건</td><td>${b.have.toFixed(1)}건</td><td>${(b.need/b.have).toFixed(2)}배</td><td>${b.hospitals.toFixed(0)}곳</td></tr>`).join('')}</tbody></table><div class="note">${R.breakeven_note}</div></div></details>
  <details><summary>결론 · 주의할 점</summary><div class="in"><h3>결론</h3><ul class="c">${R.conclusions.map(c=>`<li>${c}</li>`).join('')}</ul><h3 style="margin-top:14px">주의할 점</h3><ul class="c">${R.cautions.map(c=>`<li>${c}</li>`).join('')}</ul></div></details>`;

  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=+b.dataset.l;render()});
  app.querySelectorAll('[data-tsc]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-tsc]').forEach(x=>x.classList.toggle('on',x===b));table(b.dataset.tsc)});
  table('기준');
  if(URLQ.get('open')==='1') app.querySelectorAll('details').forEach(d=>d.open=true);

  Chart.defaults.color = css('--sub'); Chart.defaults.borderColor = css('--line'); Chart.defaults.font.size = 12; Chart.defaults.animation = false;
  const yMan = {ticks:{callback:v=>man(v)}};
  const zero = {grid:{color:c=>c.tick.value===0?css('--ink'):css('--line')}};
  chart('c1',{type:'bar',data:{labels:R.years,datasets:runs.map((r,i)=>({label:r.scenario,data:r.years.map(y=>y.op),backgroundColor:scColor[i]}))},
    options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+won(c.raw)}}},scales:{y:{...yMan,...zero}}}});
  chart('c2',{type:'line',data:{labels:['시작',...R.years.map(y=>y+' 말')],datasets:runs.map((r,i)=>({label:r.scenario,data:[0,...r.years.map(y=>y.cash_end)],borderColor:scColor[i],backgroundColor:scColor[i],borderWidth:i===1?3:2,tension:.2}))},
    options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+won(c.raw)}}},scales:{y:{...yMan,...zero}}}});
  const lv = [...R.combos, ...R.levers, ...R.ref_levers].map(x=>({n:x.name,d:x.by_L[L].delta,k:x.group}));
  chart('c3',{type:'bar',data:{labels:lv.map(x=>x.n),datasets:[{data:lv.map(x=>x.d),backgroundColor:lv.map(x=>x.k==='묶음'?css('--accent'):x.k.startsWith('요금')?css('--line'):css('--pos'))}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'3년 손익 '+manS(c.raw)+'원'}}},scales:{x:yMan,y:{ticks:{autoSkip:false}}}}});
  const S = R.sensitivity;
  chart('c4',{type:'bar',data:{labels:S.map(s=>s.name),datasets:[
    {label:'20% 낮을 때',data:S.map(s=>s.minus-R.sens_base),backgroundColor:css('--neg')},
    {label:'20% 높을 때',data:S.map(s=>s.plus-R.sens_base),backgroundColor:css('--pos')}]},
    options:{indexAxis:'y',plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': 3년차 손익 '+manS(c.raw)+'원'}}},scales:{x:yMan,y:{ticks:{autoSkip:false}}}}});
}

function table(sc){
  const Y = run(sc,L).years;
  const rows = [['hospitals_end','연말 입점 병원 (곳)',1],['deals','진료 완료 (건)',1],['fee_basic','기본 수수료 (13%)'],['fee_prem','프리미엄 수수료 (8%)'],['sub','프리미엄 연회비'],['ad','광고 배너'],['revenue','매출 합계'],['contrib','공헌이익 (매출 − 건별 비용)'],['labor','팀 인건비'],['mkt','마케팅비'],['fixed','기타 고정비'],['onboard','병원 온보딩비'],['op','연간 손익'],['cash_end','연말 통장 잔고']];
  document.getElementById('tbl').innerHTML = `<table><thead><tr><th>항목</th>${Y.map(y=>`<th>${y.y}</th>`).join('')}<th>3년 합계</th></tr></thead><tbody>
    ${rows.map(([k,n,cnt])=>{const tot=['hospitals_end','cash_end'].includes(k)?'':(cnt?Y.reduce((a,y)=>a+y[k],0).toFixed(0):man(Y.reduce((a,y)=>a+y[k],0)));
      return `<tr><td>${n}</td>${Y.map(y=>`<td class="${['op','cash_end'].includes(k)?cls(y[k]):''}">${cnt?y[k].toFixed(cnt&&k==='deals'?1:0):man(y[k])}</td>`).join('')}<td>${tot}</td></tr>`}).join('')}</tbody></table>`;
}

async function getJSON(p){ try{ const r=await fetch(p+'?t='+Date.now()); return r.ok?r.json():null }catch(e){ return null } }
async function tick(){
  if(window.__SNAPSHOT__){ if(!R){ R=window.__SNAPSHOT__.results; document.getElementById('upd').textContent='계산 '+(window.__SNAPSHOT__.generated||''); render(); } return; }
  const r = await getJSON('../output/results.json');
  if(r){ const s=JSON.stringify(r); if(s!==lastR){ lastR=s; R=r; if(!URLQ.has('L')) L=r.L_selected??1; render(); } }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
